<!DOCTYPE html>


<head>
    <style>
        body {
            margin: 0;
            background-color: white;
        }

        .container {
            position: relative;
            width: 600px;
            max-width: 100%;
            margin: 30px auto;
        }

        .background {
            display: block;
            width: 100%;
            height: auto;
        }

        .middle-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .middle-layer img {
            width: 100%;
            height: auto;
            transform: translate(-50px, 220px);
        }


        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(14, 1fr);

            z-index: 2;
        }


        .grid img {
            width: 100%;
            height: auto;
            align-self: start;
        }


        .pic1 {
            grid-row: 7;
            grid-column: 5;
        }

        .pic2 {
            grid-row: 7;
            grid-column: 4;
        }

        .pic3 {
            grid-row: 6 / 7;
            grid-column: 5 / 7;
        }

        .pic4 {
            grid-row: 8 / 9;
            grid-column: 5 / 7;
        }

        .pic5 {
            grid-row: 7;
            grid-column: 7;
        }

        .pic6 {
            grid-row: 9 / 10;
            grid-column: 6 / 7;
        }

        .pic7 {
            grid-row: 9 / 11;
            grid-column: 3 / 4;
        }

        .pic8 {
            grid-row: 10 / 14;
            grid-column: 1 / 3;
        }

        /*.pic9 {
            grid-row: 3 / 4;
            grid-column: 3 / 5;
        }*/

        .pic10 {
            grid-row: 9 / 13;
            grid-column: 1 / 10;
        }

    </style>

</head>

<body>

<main class="container">


    <img class="background"
         src="pictures/background.png"
         alt="Face collage background">

    <div class="middle-layer">
        <img src="pictures/11.png" alt="Face collage image 11">
    </div>


    <div class="grid">

            <img class="pic1" src="pictures/1.png" alt="Face collage image 1">

            <img class="pic2" src="pictures/2.png" alt="Face collage image 2">

            <img class="pic3" src="pictures/3.png" alt="Face collage image 3">

            <img class="pic4" src="pictures/4.png" alt="Face collage image 4">

            <img class="pic5" src="pictures/5.png" alt="Face collage image 5">

            <img class="pic6" src="pictures/6.png" alt="Face collage image 6">

            <img class="pic7" src="pictures/7.png" alt="Face collage image 7">

            <img class="pic8" src="pictures/8.png" alt="Face collage image 8">

            <img class="pic9" src="pictures/9.png" alt="Face collage image 9">

            <img class="pic10" src="pictures/10.png" alt="Face collage image 10">

        </div>

    </main>

</body>

</html>
