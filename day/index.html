      body {
        margin: 0;
        background-color: white;
      }

      .sky {
        position: relative;
        display: grid;
        grid-template-columns: repeat(41, 1fr);
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      .sky img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        min-width: 0;
      }


      .city1, .city2 {
        position: absolute;
        bottom: 0;
        width: 100%;
      }

      .city1 img, .city2 img {
        display: block;
        width: 100%;
        height: auto;
      }

    </style>
  </head>
