<!DOCTYPE html>

<head>

    <style>

        body {
        
            background-color: #000000;
        }


        .fridge {
            
            width: 600px;
            max-width: 100%;
            margin: 30px auto;
        }

        .fridge-background {
            width: 100%;
            height: auto;
            display: block;
        }


        .magnets {
            position: absolute;
            top: 13%;
            left: 10%;
            width: 80%;
            height: 75%;

            display: grid;
            grid-template-columns: repeat(3, 180px);
            gap: 5px 2px;

            justify-content: center;
            align-content: start;
        }


        .postcard img {
            width: 70%;
            height: auto;
            display: block;
        }

        .back {
            display: block;
        }

        .magnet img {
            width: 50%;
            height: 100%;
            display: block;
        }

    </style>

</head>

<body>

    <main class="fridge">

        <img class="fridge-background" src="fridge.PNG" alt="Refrigerator">

        <div class="magnets">

            <div class="postcard">
                <img src="magnets/1Musee.png" alt="Musee postcard">
                <img class="back" src="magnets/1Museeback.png" alt="Musee postcard back">
            </div>


            <div class="postcard">
                <img src="magnets/2BerlinWall.png" alt="Berlin Wall postcard">
                <img class="back" src="magnets/2BerlinWallback.png" alt="Berlin Wall postcard back">
            </div>


            <div class="postcard">
                <img src="magnets/3Adam.png" alt="Adam postcard">
                <img class="back" src="magnets/3Adamback.png" alt="Adam postcard back">
            </div>


            <div class="postcard">
                <img src="magnets/4Tintin.png" alt="Tintin postcard">
                <img class="back" src="magnets/4Tintinback.png" alt="Tintin postcard back">
            </div>


            <div class="postcard">
                <img src="magnets/5Hokkaido.png" alt="Hokkaido postcard">
                <img class="back" src="magnets/5Hokkaidoback.png" alt="Hokkaido postcard back">
            </div>


            <div class="postcard">
                <img src="magnets/6croissant.png" alt="Croissant postcard">
                <img class="back" src="magnets/6croissantback.png" alt="Croissant postcard back">
            </div>


            <div class="magnet">
                <img src="magnets/7.png" alt="Fridge magnet">
            </div>


            <div class="magnet">
                <img src="magnets/8.png" alt="Fridge magnet">
            </div>

        </div>

    </main>

    <script>

    let postcards = document.querySelectorAll(".postcard");

    postcards.forEach(function(postcard) {

        postcard.addEventListener("click", function() {

            let back = postcard.querySelector(".back");

            if (back.style.display === "none") {

                back.style.display = "block";

            } else {

                back.style.display = "none";

            }

        });

    });

</script>
</body>

</html>
