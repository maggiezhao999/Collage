<!DOCTYPE html>
<html>
    <head> 
        <title>HTML DEMO</title>
        <style>

            body {
                background-color: #54a7ff;
                font-family: 华文宋体;
            }
            h1 {text-align: center;
                color: #ffffff;
            }
            h2 {
                text-align: center;
                color: #ffffff;
            }
            div {
                text-align: center;
                margin: 10px 0;
                padding: 5px;

            }
            p {
                text-align: center;
                margin: 10px 0;
                padding: 5px;
                border: solid 2px;
                background-color: #ffffff;
            }
            .container {
                display: grid;
                /*.container: 10px;*/
                width: 200px;
                grid-template-columns: repeat(3,1fr);
                grid-template-rows: repeat(2,1fr);
               /* grid-template-columns: 1fr 2fr 1fr;*/
               /* grid-template-rows: 380px 300px 380px;*/
            }

            .img {
                width: 100%;
                height: 100%;
            }
            #pic1 {
               grid-row: 1 / 3;
            }
            #pic2 {
                grid-column: 2 / 4;
                
            }
            #pic3 {
                grid-column: 2;
                grid-row: 2;
            }
            #pic4 {
                grid-column: 3;
                grid-row: 2;
            }

        </style>
    </head>
    <body> 
        <h1>原 神</h1>
        <h2>米哈游出品</h2>
        <div>这是一条分界线</div>
        <p>《原神》是由米哈游开发的一款开放世界冒险角色扮演游戏。</p>
        <div class="container">
            <div>
                <img id="pic1"
                style="width: 400px;"
                width="100"
                src="https://i.guim.co.uk/img/media/c02934eacf9682a4e11d9194e0493feea9f6ddab/372_33_1381_829/master/1381.jpg?width=1200&quality=85&auto=format&fit=max&s=dc8759802df598c52d8b435f6cdb4b62"
            />
            </div>
            <div>
                <img id="pic2"
                style="width: 400px;"
                width="100"
                src="https://i.guim.co.uk/img/media/c02934eacf9682a4e11d9194e0493feea9f6ddab/372_33_1381_829/master/1381.jpg?width=1200&quality=85&auto=format&fit=max&s=dc8759802df598c52d8b435f6cdb4b62"
            />
            </div>
            <div>
                <img id="pic3"
                style="width: 400px;"
                width="100"
                src="https://i.guim.co.uk/img/media/c02934eacf9682a4e11d9194e0493feea9f6ddab/372_33_1381_829/master/1381.jpg?width=1200&quality=85&auto=format&fit=max&s=dc8759802df598c52d8b435f6cdb4b62"
            />
            </div>
            <div>
                <img id="pic4"
                style="width: 400px;"
                width="100"
                src="https://i.guim.co.uk/img/media/c02934eacf9682a4e11d9194e0493feea9f6ddab/372_33_1381_829/master/1381.jpg?width=1200&quality=85&auto=format&fit=max&s=dc8759802df598c52d8b435f6cdb4b62"
            />
            </div>
        </div>
    </body>
</html>
